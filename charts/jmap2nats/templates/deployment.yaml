apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jmap2nats.fullname" . }}
  labels:
    {{- include "jmap2nats.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jmap2nats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "jmap2nats.configJson" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jmap2nats.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "jmap2nats.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jmap2nats
          image: {{ include "jmap2nats.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JMAP2NATS_CONFIG
              value: /etc/jmap2nats/config.json
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/jmap2nats/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /etc/jmap2nats/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "jmap2nats.fullname" . }}
        - name: secrets
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: {{ .Values.auth.jmap.secretName | quote }}
                  items:
                    - key: {{ .Values.auth.jmap.secretKey }}
                      path: token
              {{- if .Values.auth.nats.tokenKey }}
              - secret:
                  name: {{ .Values.auth.nats.secretName | default .Values.auth.jmap.secretName | quote }}
                  items:
                    - key: {{ .Values.auth.nats.tokenKey }}
                      path: nats.token
              {{- end }}
              {{- if .Values.auth.nats.passwordKey }}
              - secret:
                  name: {{ .Values.auth.nats.secretName | default .Values.auth.jmap.secretName | quote }}
                  items:
                    - key: {{ .Values.auth.nats.passwordKey }}
                      path: nats.password
              {{- end }}
              {{- if .Values.auth.nats.credsKey }}
              - secret:
                  name: {{ .Values.auth.nats.secretName | default .Values.auth.jmap.secretName | quote }}
                  items:
                    - key: {{ .Values.auth.nats.credsKey }}
                      path: nats.creds
              {{- end }}
              {{- if .Values.auth.nats.secretKey }}
              - secret:
                  name: {{ .Values.auth.nats.secretName | default .Values.auth.jmap.secretName | quote }}
                  items:
                    - key: {{ .Values.auth.nats.secretKey }}
                      path: nats.nk
              {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
